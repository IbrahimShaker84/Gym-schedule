<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول التمرين الأسبوعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d14;
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    color: #f0f0f5;
    direction: rtl;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0d0d14; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .header {
    background: linear-gradient(180deg, #1a1a2e 0%, #0d0d14 100%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 28px 20px 20px;
    text-align: center;
  }
  .header-tag {
    display: inline-block;
    background: rgba(240,180,41,0.1);
    border: 1px solid rgba(240,180,41,0.25);
    color: #f0b429;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 900;
    background: linear-gradient(135deg, #f0b429, #e85d04);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header p { color: #666; font-size: 13px; }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 14px 14px 0;
    overflow-x: auto;
    background: #111118;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    padding: 10px 16px;
    border-radius: 10px 10px 0 0;
    border: none;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    background: transparent;
    color: #666;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active { color: #fff; }

  .content { max-width: 720px; margin: 0 auto; padding: 20px 14px 50px; }

  .day-title-card {
    border-radius: 16px; padding: 18px 20px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 14px; border: 1px solid;
  }
  .day-emoji { font-size: 34px; flex-shrink: 0; }
  .day-text { flex: 1; }
  .day-text h2 { font-size: 20px; font-weight: 900; margin-bottom: 3px; }
  .day-text p { color: #888; font-size: 12px; }
  .day-tag { color: #fff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; flex-shrink: 0; }

  .ex-card {
    background: #16161f; border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s;
  }
  .ex-header {
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .ex-num {
    width: 32px; height: 32px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 13px;
    font-weight: 900; flex-shrink: 0; border: 1px solid;
  }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .ex-name { font-weight: 800; font-size: 14px; }
  .equip-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
  .ex-name-ar { color: #888; font-size: 11px; margin-bottom: 6px; }
  .stats-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .stat-pill {
    font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 20px;
    background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.08);
  }
  .ex-arrow { color: #444; font-size: 20px; flex-shrink: 0; transition: transform 0.2s; line-height: 1; }
  .ex-arrow.open { transform: rotate(180deg); }

  .ex-body { display: none; border-top: 1px solid rgba(255,255,255,0.06); padding: 14px 16px; background: #12121a; }
  .ex-body.open { display: block; }

  .tip-box {
    background: rgba(240,180,41,0.06); border: 1px solid rgba(240,180,41,0.15);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .tip-box span { font-size: 18px; flex-shrink: 0; }
  .tip-box p { font-size: 12px; color: #ccc; line-height: 1.7; }

  .yt-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #FF0000; color: #fff; border-radius: 10px; padding: 12px 18px;
    font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 13px;
    text-decoration: none; transition: opacity 0.2s; -webkit-tap-highlight-color: transparent;
  }
  .yt-btn:hover { opacity: 0.85; }
  .yt-btn:active { opacity: 0.7; }

  .legend { background: #16161f; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 14px 16px; margin-top: 18px; }
  .legend-title { font-size: 11px; color: #666; margin-bottom: 10px; font-weight: 700; }
  .legend-items { display: flex; gap: 8px; flex-wrap: wrap; }
  .legend-item { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid; }

  .tips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .tip-card { background: #16161f; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .tip-card-icon { font-size: 20px; flex-shrink: 0; }
  .tip-card-title { font-size: 12px; font-weight: 700; color: #f0b429; margin-bottom: 3px; }
  .tip-card-text { font-size: 11px; color: #888; line-height: 1.5; }

  @media (max-width: 400px) {
    .tips-grid { grid-template-columns: 1fr; }
    .ex-name { font-size: 13px; }
  }
</style>
</head>

const tips = [
  { icon:"🥩", title:"البروتين", text:"1.5-2 جرام × وزنك يومياً" },
  { icon:"💧", title:"المياه", text:"3 لتر+ يومياً في الدوحة" },
  { icon:"📈", title:"Progressive Overload", text:"زد الوزن تدريجياً كل أسبوعين" },
  { icon:"😴", title:"النوم", text:"7-8 ساعات — فيها العضلة تكبر" }

let activeDay = 0;
let openEx = null;

function render() { renderTabs(); renderContent(); }

function renderTabs() {
  document.getElementById('tabs').innerHTML = days.map((d, i) => `
    <button class="tab-btn ${i===activeDay?'active':''}"
      style="${i===activeDay?`background:${d.color};border-bottom-color:${d.color};`:''}"
      onclick="switchDay(${i})">${d.label}</button>
  `).join('');
}

function renderContent() {
  const d = days[activeDay];
  const exHTML = d.exercises.map((ex, i) => {
    const ec = equipColor[ex.equipment] || '#888';
    const isOpen = openEx === i;
    const stats = [ex.sets, ex.reps, ex.rest].filter(s => s !== '—');
    return `
      <div class="ex-card" id="ex-${i}" style="${isOpen?`border-color:${d.border}`:''}">
        <div class="ex-header" onclick="toggleEx(${i})">
          <div class="ex-num" style="background:${d.bg};border-color:${d.border};color:${d.color}">${i+1}</div>
          <div class="ex-info">
            <div class="ex-name-row">
              <span class="ex-name">${ex.name}</span>
              <span class="equip-badge" style="background:${ec}22;color:${ec};border-color:${ec}44">${ex.equipment}</span>
            </div>
            <div class="ex-name-ar">${ex.nameAr} · ${ex.muscle}</div>
            <div class="stats-row">${stats.map(s=>`<span class="stat-pill">${s}</span>`).join('')}</div>
          </div>
          <span class="ex-arrow ${isOpen?'open':''}">▾</span>
        </div>
        <div class="ex-body ${isOpen?'open':''}">
          <div class="tip-box"><span>💡</span><p>${ex.tip}</p></div>
          <a class="yt-btn" href="${ex.youtube}" target="_blank" rel="noreferrer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="white" style="flex-shrink:0">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            شاهد فيديو الأداء الصحيح على يوتيوب
          </a>
        </div>
      </div>`;
  }).join('');

  const legendHTML = Object.entries(equipColor).map(([k,v])=>
    `<span class="legend-item" style="background:${v}18;color:${v};border-color:${v}33">${k}</span>`
  ).join('');

  const tipsHTML = tips.map(t=>`
    <div class="tip-card">
      <span class="tip-card-icon">${t.icon}</span>
      <div><div class="tip-card-title">${t.title}</div><div class="tip-card-text">${t.text}</div></div>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="day-title-card" style="background:${d.bg};border-color:${d.border}">
      <span class="day-emoji">${d.emoji}</span>
      <div class="day-text"><h2>${d.title}</h2><p>${d.subtitle} · ${d.exercises.length} تمارين</p></div>
      <span class="day-tag" style="background:${d.color}">${d.tag}</span>
    </div>
    ${exHTML}
    <div class="legend"><div class="legend-title">دليل الألوان — نوع الجهاز</div><div class="legend-items">${legendHTML}</div></div>
    <div class="tips-grid">${tipsHTML}</div>`;
}

function switchDay(i) {
  activeDay = i; openEx = null; render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleEx(i) {
  openEx = openEx === i ? null : i;
  renderContent();
  setTimeout(() => {
    if (openEx === i) {
      const el = document.getElementById('ex-' + i);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, 50);
}

render();
</script>
</body>
</html>
